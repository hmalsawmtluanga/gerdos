# GERDOS continuous integration: both build configs, the leakage guard,
# the demo, and the gated-hardware policy (skip-with-reason where no
# device exists, never fake-green).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - build_dir: build
            build_type: ""
          - build_dir: build-release
            build_type: -DCMAKE_BUILD_TYPE=Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B ${{ matrix.build_dir }}
          ${{ matrix.build_type }}
      - name: Build (zero warnings)
        run: cmake --build ${{ matrix.build_dir }} -j
      - name: Report suite registration
        run: >
          ctest --test-dir ${{ matrix.build_dir }} -N |
          tee /tmp/gerdos-suites.txt;
          grep -c ": " /tmp/gerdos-suites.txt;
          grep "hetero\|real_benchmark\|vk_compute\|demo" /tmp/gerdos-suites.txt ||
          echo "NOTE: hardware suites unregistered (no toolchain) — not skipped, absent"
      - name: Test (hardware suites skip without devices)
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
      - name: Python driver (signal chain)
        run: >
          PYTHONPATH=${{ github.workspace }}/python
          python3 -m gerdos
          ${{ matrix.build_dir }}
          workloads/signal_chain.gwd

  build-wheels:
    # Platform wheels: built, selftested, uploaded as artifacts.
    # Never published automatically — inspected first, uploaded by hand.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2
        with:
          output-dir: wheelhouse
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

