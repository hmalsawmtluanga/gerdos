[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gerdos"
dynamic = ["version"]
description = "Global Execution Runtime for Dynamic Open Systems — revive old hardware with measured execution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["heterogeneous", "runtime", "opencl", "vulkan", "revival"]

[project.scripts]
gerdos = "gerdos:cli"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
gerdos = ["data/*.gwd", "native/*.so"]
gerdos_native = ["*.so"]

[tool.cibuildwheel]
# Linux glibc only in v1; other platforms build from the sdist.
build = ["cp310-manylinux_*", "cp311-manylinux_*", "cp312-manylinux_*", "cp313-manylinux_*"]
archs = ["x86_64", "aarch64"]
# manylinux images carry gcc; cmake arrives here.
before-all = "yum install -y cmake"
# The wheel bundles the release native lib; prove it on the spot.
test-command = "python -m gerdos selftest"
